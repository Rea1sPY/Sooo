name: Build Android APK (Godot)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.2.2
  EXPORT_NAME: OneMinuteToDie

jobs:
  export-android:
    runs-on: ubuntu-22.04

    container:
      image: barichello/godot-ci:4.2.2

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure Java, Android SDK and Godot
        shell: bash
        run: |
          set -eu

          echo "Checking Java..."
          java -version

          echo "Checking Android SDK..."
          test -d /usr/lib/android-sdk
          test -d /usr/lib/jvm/java-17-openjdk-amd64
          test -f /root/debug.keystore

          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates"

          if [ "$HOME" != "/root" ]; then
            cp -a /root/.local/share/godot/export_templates/4.2.2.stable \
              "$HOME/.local/share/godot/export_templates/" 
          fi

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          echo "Android export settings configured."

      - name: Import project resources
        run: |
          godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          mkdir -p build/android

          godot --headless --verbose \
            --path . \
            --export-debug "Android" \
            "$(pwd)/build/android/${EXPORT_NAME}.apk"

      - name: Verify APK
        run: |
          test -s "build/android/${EXPORT_NAME}.apk"
          ls -lh "build/android/${EXPORT_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: one-minute-to-die-apk
          path: build/android/OneMinuteToDie.apk
          if-no-files-found: error
